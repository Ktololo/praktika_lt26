name: CI - Build and Test
on:
  push:
    branches: [ task02, main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore practice2025.sln
    - name: Build
      run: dotnet build practice2025.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test practice2025.sln --configuration Release --no-build --verbosity normal
