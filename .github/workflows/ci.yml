name: CI - Build and Test
on:
  push:
    branches: [ task19, main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore task19
      run: dotnet restore task19/task19.csproj
    - name: Build task19
      run: dotnet build task19/task19.csproj --configuration Release --no-restore
    - name: Restore task19tests
      run: dotnet restore task19tests/task19tests.csproj
    - name: Build task19tests
      run: dotnet build task19tests/task19tests.csproj --configuration Release --no-restore
    - name: Run tests
      run: dotnet test task19tests/task19tests.csproj --configuration Release --no-build --verbosity normal
