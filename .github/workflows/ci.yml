name: CI - Build and Test
on:
  push:
    branches: [ task02, main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore task02
      run: dotnet restore task02/task02.csproj
    - name: Build task02
      run: dotnet build task02/task02.csproj --configuration Release --no-restore
    - name: Restore task02Tests
      run: dotnet restore task02tests/task02tests.csproj
    - name: Build task02Tests
      run: dotnet build task02tests/task02tests.csproj --configuration Release --no-restore
    - name: Run tests
      run: dotnet test task02tests/task02tests.csproj --configuration Release --no-build --verbosity normal
