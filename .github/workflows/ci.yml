name: CI - Build and Test
on:
  push:
    branches: [ task07, main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore task07
      run: dotnet restore task07/task07.csproj
    - name: Build task07
      run: dotnet build task07/task07.csproj --configuration Release --no-restore
    - name: Restore task07Tests
      run: dotnet restore task07Tests/task07Tests.csproj
    - name: Build task07Tests
      run: dotnet build task07Tests/task07Tests.csproj --configuration Release --no-restore
    - name: Run tests
      run: dotnet test task07Tests/task07Tests.csproj --configuration Release --no-build --verbosity normal
