name: CI - Build and Test
on:
  push:
    branches: [ task11, main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore task11
      run: dotnet restore task11/task11.csproj
    - name: Build task11
      run: dotnet build task11/task11.csproj --configuration Release --no-restore
    - name: Restore task11tests
      run: dotnet restore task11tests/task11tests.csproj
    - name: Build task11tests
      run: dotnet build task11tests/task11tests.csproj --configuration Release --no-restore
    - name: Run tests
      run: dotnet test task11tests/task11tests.csproj --configuration Release --no-build --verbosity normal
