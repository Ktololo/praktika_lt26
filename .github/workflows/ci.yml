name: CI - Build and Test

on:
  push:
    branches: [ task18, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore task18
      run: dotnet restore task18/task18.csproj

    - name: Build task18
      run: dotnet build task18/task18.csproj --configuration Release --no-restore

    - name: Restore task18tests
      run: dotnet restore task18tests/task18tests.csproj

    - name: Build task18tests
      run: dotnet build task18tests/task18tests.csproj --configuration Release --no-restore

    - name: Run tests
      run: dotnet test task18tests/task18tests.csproj --configuration Release --no-build --verbosity normal
